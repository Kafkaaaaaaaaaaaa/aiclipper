name: AI Video Clipper Runner

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube Video URL to Clip'
        required: true
        default: 'https://www.youtube.com/watch?v=jNQXAC9IVRw'

jobs:
  clip-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject YouTube Cookies
        run: |
          echo "${{ secrets.YOUTUBE_COOKIES }}" > cookies.txt

      - name: Run Video Processing Script
        env:
          VIDEO_URL: ${{ github.event.inputs.video_url }}
        run: |
          python app.py

      - name: Upload Processed Short
        uses: actions/upload-artifact@v4
        with:
          name: generated-short
          path: output_short.mp4
