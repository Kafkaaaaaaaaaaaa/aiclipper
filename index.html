
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free GitHub AI Video Clipper</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-indigo-500">
            GitHub-Powered AI Clipper
        </h1>
        <p class="text-sm text-slate-400 mb-6">
            Paste a YouTube link. This triggers a free GitHub Action to process, crop, and subtitle your video.
        </p>

        <div class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">
                    YouTube Video URL
                </label>
                <input 
                    type="url" 
                    id="videoUrl" 
                    placeholder="https://www.youtube.com/watch?v=..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors"
                >
            </div>

            <button 
                onclick="triggerGitHubAction()" 
                id="generateBtn"
                class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition-all shadow-lg shadow-cyan-500/20"
            >
                Dispatch GitHub Cloud Clipper
            </button>
        </div>

        <div id="statusBox" class="hidden mt-6 p-4 bg-slate-950 border border-slate-800 rounded-xl text-center space-y-2">
            <div class="inline-block animate-spin rounded-full h-6 w-6 border-2 border-cyan-500 border-t-transparent"></div>
            <p id="statusText" class="text-xs text-cyan-400 font-medium">Triggering GitHub workflow runner...</p>
        </div>
    </div>

    <script>
        function triggerGitHubAction() {
            const url = document.getElementById('videoUrl').value;
            if (!url) {
                alert("Please paste a valid YouTube URL.");
                return;
            }

            const btn = document.getElementById('generateBtn');
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');

            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            statusBox.classList.remove('hidden');

            // Instructions for user since direct client-side GitHub workflow triggering requires a Personal Access Token (PAT)
            setTimeout(() => {
                statusText.innerHTML = "Because of browser security, go to your <b>GitHub Repo > Actions > Run Workflow</b>, paste your URL, and let the cloud handle it for free!";
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }, 2000);
        }
    </script>
</body>
</html>
